apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    compileSdkVersion safeExtGet('compileSdkVersion', 35)
    namespace "org.pgsqlite"

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 35)
        versionCode 1
        versionName "1.0"
    }
    lint {
        abortOnError false
    }
}

repositories {
    mavenCentral()
    google()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'com.github.dryganets:sqlite-adapter:0.0.1'
    // android-database-sqlcipher is deprecated and its prebuilts may be incompatible
    // with Android 16 KB page-size devices. Use the modern SQLCipher Android AAR instead.
    implementation 'net.zetetic:sqlcipher-android:4.14.0@aar'
    // Required by sqlcipher-android (provides androidx.sqlite.db.* types such as SupportSQLiteDatabase)
    implementation 'androidx.sqlite:sqlite:2.6.2'
    implementation 'com.facebook.react:react-native:+'
}
